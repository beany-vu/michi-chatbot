services:
  db:
    # pgvector's image IS the official postgres image plus the pgvector extension —
    # useful later for RAG/embeddings without a migration to a different image.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_DB: chatbot
      # Local-dev only: passwordless auth, matching the passwordless connection string.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Host port is configurable because dev machines often have other Postgres
      # instances on 5432/5433. Point User Secrets / ConnectionStrings__Chatbot here.
      - "127.0.0.1:${MICHI_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__Chatbot: "Host=db;Port=5432;Database=chatbot;Username=chatbot"
      ASPNETCORE_URLS: "http://+:8080"
      # Ollama runs INSIDE this machine's WSL distro (not Windows) — replaced LM Studio (2026-07-24),
      # whose Windows-side server was never reachable from WSL/Docker. host.docker.internal does NOT
      # reach it either (that only routes to Windows' real interfaces; WSL's loopback-forwarded ports
      # are a Windows Firewall gap, not fixable from here) — Docker CAN reach the WSL distro's own
      # eth0 IP directly though, hence MICHI_OLLAMA_HOST from the gitignored .env (see its comment).
      Llm__BaseUrl: "http://${MICHI_OLLAMA_HOST}:11434/v1"
      Llm__Model: "${MICHI_LLM_MODEL}"
      GoogleCalendar__CredentialsPath: "/run/secrets/google-calendar.json"
      # OTLP over gRPC to Jaeger, same docker network.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      - ${MICHI_GOOGLE_SA_KEY_PATH}:/run/secrets/google-calendar.json:ro
    ports:
      - "127.0.0.1:${MICHI_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started

  # Trace viewer (phase 3) — all-in-one Jaeger: OTLP receiver + UI, nothing else to configure.
  # Dev only; plan.md's original idea was the .NET-native Aspire dashboard, but Jaeger needs zero
  # extra wiring beyond the standard OTLP exporter, so it's the simpler choice here.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${MICHI_JAEGER_UI_PORT:-16686}:16686"

  # Browser DB inspector — nothing to configure, connect with Server=db, User=chatbot, DB=chatbot,
  # blank password (same trust auth as psql). Not for prod; dev convenience only.
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:${MICHI_ADMINER_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
